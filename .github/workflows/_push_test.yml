# 使い捨て。Actions から push できるかを確かめるためだけのもの。確認後に削除する。
# main には触らず、一時ブランチ ci-push-test にだけ書く。
name: _push権限の確認

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 一時ブランチへ push できるか
        run: |
          git config user.name  "yuichiro-yokote"
          git config user.email "yuichiro-yokote@users.noreply.github.com"
          git checkout -b ci-push-test
          date -u > .push-test
          git add .push-test
          git commit -m "push権限の確認（使い捨て）"
          git push -f origin ci-push-test
          echo "PUSH_OK"
